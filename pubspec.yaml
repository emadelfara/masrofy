name: masrofy
description: "Masrofy - Personal Finance Manager"

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.2.0
  smooth_page_indicator: ^1.2.1
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.1
  build_runner: ^2.15.1

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800


  assets:
    - assets/images/
    - assets/images/illustrations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
